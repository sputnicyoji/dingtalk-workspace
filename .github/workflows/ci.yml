name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: T1 lint + typecheck + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/dingtalk-workspace-mcp
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/dingtalk-workspace-mcp/package-lock.json

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Tests + coverage gate
        run: npx vitest run --coverage

      - name: Build
        run: npm run build
